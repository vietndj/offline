<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đang mở ứng dụng Zalo...</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.06), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
    }
    .icon-badge {
      width: 68px;
      height: 68px;
      background: #0068ff;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px -4px rgba(0, 104, 255, 0.35);
    }
    .icon-badge svg {
      width: 38px;
      height: 38px;
      fill: white;
    }
    h1 {
      font-size: 21px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    p.desc {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .phone-pill {
      display: inline-block;
      background: #eff6ff;
      color: #0068ff;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 9999px;
      font-size: 16px;
      letter-spacing: 0.02em;
      margin-top: 6px;
      border: 1px solid #bfdbfe;
    }
    .btn-app {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: #0068ff;
      color: #ffffff;
      padding: 15px 20px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 104, 255, 0.25);
    }
    .btn-app:hover {
      background: #0056d6;
    }
    .btn-app:active {
      transform: scale(0.98);
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 22px 0 16px;
      color: #94a3b8;
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #e2e8f0;
    }
    .divider::before { margin-right: 12px; }
    .divider::after { margin-left: 12px; }
    .btn-web {
      display: inline-block;
      color: #64748b;
      font-size: 13px;
      text-decoration: underline;
      transition: color 0.2s;
    }
    .btn-web:hover {
      color: #0f172a;
    }
    .hint {
      margin-top: 24px;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-badge">
      <svg viewBox="0 0 48 48">
        <path d="M24 4C12.95 4 4 12.95 4 24C4 27.68 5 31.12 6.74 34.07L4.5 43.5L14.19 41.33C17.07 43 20.42 44 24 44C35.05 44 44 35.05 44 24C44 12.95 35.05 4 24 4Z" fill="#0068FF"/>
        <path d="M15 18H23L17 27H23V30H15L21 21H15V18Z" fill="white"/>
        <path d="M25 30V18H28V30H25Z" fill="white"/>
        <path d="M29.5 30V18H32.5V30H29.5Z" fill="white"/>
      </svg>
    </div>
    <h1>Đang mở ứng dụng Zalo</h1>
    <p class="desc">
      Kết nối trò chuyện tới số:<br/>
      <span class="phone-pill" id="displayPhone">...</span>
    </p>

    <a id="openAppBtn" href="#" class="btn-app">
      <span>💬 Mở Ngay Trong App Zalo</span>
    </a>

    <div class="divider">hoặc nếu không có App</div>

    <a id="openWebBtn" href="#" class="btn-web" target="_blank" rel="noopener noreferrer">
      Mở Zalo Web (zalo.me)
    </a>

    <p class="hint">Đang tự động chuyển hướng sang ứng dụng Zalo trên máy của bạn...</p>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var rawPhone = params.get('phone') || params.get('p') || '0934688632';
      var phone = rawPhone.replace(/[^0-9]/g, '');
      if (phone.indexOf('84') === 0 && phone.length >= 11) {
        phone = '0' + phone.slice(2);
      }
      if (phone.indexOf('0') !== 0 && phone.length === 9) {
        phone = '0' + phone;
      }

      document.getElementById('displayPhone').innerText = phone;
      var appUrl = 'zalo://conversation?phone=' + phone;
      var webUrl = 'https://zalo.me/' + phone;

      var appBtn = document.getElementById('openAppBtn');
      var webBtn = document.getElementById('openWebBtn');
      appBtn.href = appUrl;
      webBtn.href = webUrl;

      // 1. Tự động kích hoạt mở app
      try {
        window.location.href = appUrl;
      } catch (e) {}

      // 2. Thử lại sau 400ms nếu trình duyệt cần thêm nhịp
      setTimeout(function() {
        try {
          window.location.href = appUrl;
        } catch (e) {}
      }, 400);
    })();
  </script>
</body>
</html>
